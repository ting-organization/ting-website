<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Page not found · Ting</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <style>
    :root { color-scheme: light dark; --bg: #f4f1e9; --text: #16151b; --muted: #6c6972; --primary: #4338ca; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111015; --text: #ece9e1; --muted: #9794a0; --primary: #aaa5ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    main { max-width: 520px; padding: 24px; }
    h1 { margin: 0 0 16px; font: 400 clamp(44px, 9vw, 68px)/1 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; letter-spacing: -.03em; }
    h1 em { color: var(--primary); }
    p { margin: 0 0 24px; color: var(--muted); }
    a { color: var(--text); font-weight: 600; text-underline-offset: 4px; }
    nav { display: flex; gap: 28px; }
  </style>
</head>
<body>
  <main>
    <h1>Page <em>not found</em></h1>
    <p>There is nothing at this address. The home page links to everything, and the wiki starts with why Ting exists.</p>
    <nav><a data-page="" href="/">Home</a><a data-page="wiki/" href="/wiki/">The wiki</a></nav>
  </main>
  <script>
    // The site may be served from a folder (GitHub Pages serves a project at
    // /<repository>/), and this page from any address below it: find the
    // folder by where the site's stylesheet is.
    (async () => {
      const first = location.pathname.split('/')[1];
      if (!first) return;
      try {
        const answer = await fetch('/' + first + '/assets/site.css', {method: 'HEAD'});
        if (answer.ok) for (const link of document.querySelectorAll('[data-page]')) link.href = '/' + first + '/' + link.dataset.page;
      } catch {}
    })();
  </script>
</body>
</html>
